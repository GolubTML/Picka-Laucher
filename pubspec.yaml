name: picka_launcher
description: "Laucher for Picka"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.14.0-85.0.dev

dependencies:
  flutter:
    sdk: flutter
    
  archive: ^3.6.1
  path_provider: ^2.1.1
  file_picker: 10.3.8
  permission_handler: ^12.0.1
  open_filex: ^4.7.0
  
  cupertino_icons: ^1.0.8
  external_app_launcher: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/patch_files/libil2cpp.so
    - assets/patch_files/libloader.so
    - assets/patch_files/libpayload.so
    - assets/patch_files/classes.dex
    - assets/patch_files/AndroidManifest.xml
    - assets/default_mod/

  fonts:
    - family: Terraria
      fonts:
      - asset: assets/fonts/ANDYB.ttf
